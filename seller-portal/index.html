<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO — seller portal is indexable for seller recruitment -->
    <title>NOREN Seller Portal | Sell Fashion Online India | Join NOREN Marketplace</title>
    <meta name="description" content="Become a NOREN seller. List your fashion products on India's premium marketplace. Easy onboarding, fast payouts, and a growing customer base. Apply now." />
    <meta name="keywords" content="NOREN seller portal, sell fashion online India, fashion marketplace India, become NOREN seller, clothing seller India, online fashion seller" />
    <meta name="author" content="NOREN - Dinesh Global Enterprise Pvt. Ltd." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://seller.norenfastion.shop/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="NOREN Seller Portal | Sell Fashion Online India" />
    <meta property="og:description" content="Join NOREN's growing seller marketplace. List products, manage orders, and get paid fast. India's premium fashion platform." />
    <meta property="og:url"         content="https://seller.norenfastion.shop/" />
    <meta property="og:site_name"   content="NOREN Seller Portal" />
    <meta property="og:image"       content="https://www.norenfastion.shop/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://www.norenfastion.shop/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="NOREN Seller Portal" />
    <meta property="og:locale"       content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="NOREN Seller Portal | Sell Fashion Online India" />
    <meta name="twitter:description" content="Join NOREN's growing seller marketplace. List products, manage orders, and get paid fast." />
    <meta name="twitter:image"       content="https://www.norenfastion.shop/og-image.jpg" />
    <meta name="twitter:site"        content="@noren_in" />

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NOREN Seller Portal",
      "url": "https://seller.norenfastion.shop/",
      "description": "Seller portal for NOREN fashion marketplace. List products, track orders, manage payouts.",
      "publisher": {
        "@type": "Organization",
        "name": "NOREN",
        "legalName": "Dinesh Global Enterprise Private Limited",
        "url": "https://www.norenfastion.shop/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.norenfastion.shop/logo.png",
          "width": 512,
          "height": 512
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "supportnoren1@gmail.com",
          "contactType": "seller support"
        },
        "sameAs": [
          "https://www.instagram.com/noren_in",
          "https://www.facebook.com/norenfashion"
        ]
      },
      "potentialAction": {
        "@type": "RegisterAction",
        "target": "https://seller.norenfastion.shop/register",
        "name": "Become a NOREN Seller"
      }
    }
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="https://www.norenfastion.shop/logo.png" />
    <link rel="apple-touch-icon" href="https://www.norenfastion.shop/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1a18" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1a1a18; -webkit-font-smoothing: antialiased; }
      .spinner { width: 28px; height: 28px; border: 3px solid rgba(201,169,110,0.2); border-top-color: #c9a96e; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 9px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
